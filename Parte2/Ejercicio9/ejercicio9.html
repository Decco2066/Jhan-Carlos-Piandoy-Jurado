<!DOCTYPE html>
<html lang="es">


<!-- 
    Ejercicio 9: aplica un segundo tema cambiando únicamente las variables de :root (del ejercicio3)


-->

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Encuesta de satisfacción </title>
    <link rel="stylesheet" href="/Parte2/Ejercicio1/styles_ej9.css">
</head>

<body>
    <form action="#" method="post">
        <h1> Encuesta de satisfacción </h1>
        <p> Danos tu opinión </p>

        <fieldset>
            <legend>¿Cómo calificarías tu experiencia general?</legend>
            <div class="choice-list">
                <label class="choice">
                    <input type="radio" name="experiencia" value="excelente" checked>
                    <span>Excelente</span>

                </label>

                <label class="choice">

                    <input type="radio" name="experiencia" value="buena">
                    <span>Buena</span>
                     
                </label>

                <label class="choice">

                    <input type="radio" name="experiencia" value="regular">
                    <span>Regular</span>
                     
                </label>

                <label class="choice">

                    <input type="radio" name="experiencia" value="mala">
                    <span>Mala</span>
                     
                </label>

            </div>

        </fieldset>
        
        <fieldset>
            <legend> ¿Qué aspectos te gustaron?</legend>

            <div class="choice-list">
                <label class="choice">
                    <input type="checkbox" name="aspectos" value="atencion" checked>
                    <span>Atención al cliente</span>

                </label>

                <label class="choice">

                    <input type="checkbox" name="aspectos" value="tiempos">
                    <span>Tiempos de espera</span>
                     
                </label>

                <label class="choice">

                    <input type="checkbox" name="aspectos" value="calidad">
                    <span>Calidad del servicio</span>
                     
                </label>

                <label class="choice">

                    <input type="checkbox" name="aspectos" value="precio">
                    <span>Relación precio/calidad</span>
                     
                </label>

            </div>

        </fieldset>

        <div class="form-field">
            <label for="recomendacion">¿Qué tan probable es que nos recomiendes? (0-10)</label>
            <input type="range" id="recomendacion" name="recomendacion" min="0" max="10" value="5" >

        </div>

        <div class="form-field">
            <label for="comentario">Comentarios adicionales</label>
            <textarea id="comentario" name="comentario" rows="5" maxlength="500"></textarea>


        </div>
        
        <div class="form-actions">
            <button type="submit" class="button button-primary">Enviar encuesta</button>
            <button type="reset" class=" button button-secondary">Limpiar</button>


        </div>

    </form>

</body>


</html>
